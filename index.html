<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }
    nav {
      background: #333;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    nav a {
      display: block;
      padding: 16px 24px;
      color: white;
      text-decoration: none;
    }
    nav a:hover {
      background: #555;
    }
    main {
      padding: 30px 20px;
    }
    img {
      max-width: 90%;
      height: auto;
      border-radius: 8px;
    }
    h1 {
      font-size: 3rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="#">pagina 1</a></li>
      <li><a href="#">pagina 2</a></li>
      <li><a href="#">pagina 3</a></li>
    </ul>
  </nav>

  <main>
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='300'><rect width='600' height='300' fill='%234a90d9'/><circle cx='300' cy='150' r='80' fill='%23ffd93d'/><text x='300' y='260' font-size='28' text-anchor='middle' fill='white' font-family='Arial'>Imagen</text></svg>" alt="Imagen de ejemplo">
    <h1>Pagina de prueba</h1>
  </main>

</body>
</html>
